name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r dependencies.txt

      - name: Build static site
        env:
          FLASK_APP: app.py
        run: |
          flask freeze
          # 1.js / 3.js 用 ./title.mp4、./model.mp4 … 这些相对页面根目录的地址，
          # 2.js 的人物视频在 ./assets/ 下，所以都发布到站点根目录。
          mkdir -p public/assets
          cp -R static/home/assets/. public/assets/
          cp static/home/*.webm public/
          cp static/home/*.mp4 public/
          cp static/home/5.css public/
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
