<header class="site-header">
        <img src="{{ asset_url('head_foot/STING_logo_Blue.png') }}" alt="STING Logo" class="logo">

        <!-- 移动端：右侧三层叠放按钮。勾选状态同时作为菜单展开的 CSS 状态源 -->

            <input type="checkbox" id="nav-toggle" aria-label="Open menu">
            <span class="nav-toggle-btn" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </label>

        <nav id="site-nav">
            <!-- 1. HOME -->
            <div class="nav-item">
                <a href="{{ url_for('home') }}" class="nav-link"{% if request.endpoint == "home" %} aria-current="page"{% endif %}>HOME</a>
            </div>
            
            <!-- 2. TEAM -->
            <div class="nav-item">
                <a href="#" class="nav-link">TEAM</a>
                <div class="dropdown-menu">
                    <a href="{{ url_for('pages', page='members') }}" class="dropdown-item"{% if request.endpoint == "team" or (request.endpoint == "pages" and request.view_args.get("page") == "members") %} aria-current="page"{% endif %}>Members</a>
                    <a href="{{ url_for('pages', page='attributions') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "attributions" %} aria-current="page"{% endif %}>Attributions</a>
                    <a href="{{ url_for('pages', page='notebook') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "notebook" %} aria-current="page"{% endif %}>Notebook</a>
                    <a href="{{ url_for('pages', page='experiments') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "experiments" %} aria-current="page"{% endif %}>Experiments</a>
                    <a href="{{ url_for('pages', page='safety') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "safety" %} aria-current="page"{% endif %}>Safety</a>
                    <a href="{{ url_for('pages', page='collaboration') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "collaboration" %} aria-current="page"{% endif %}>Collaborations</a>
                </div>
            </div>

            <!-- 3. PROJECT -->
            <div class="nav-item">
                <a href="#" class="nav-link">PROJECT</a>
                <div class="dropdown-menu">
                    <a href="{{ url_for('pages', page='description') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "description" %} aria-current="page"{% endif %}>Description</a>
                    <a href="{{ url_for('pages', page='design') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "design" %} aria-current="page"{% endif %}>Design</a>
                    <a href="{{ url_for('pages', page='engineering') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "engineering" %} aria-current="page"{% endif %}>Engineering<br>Success</a>
                    <a href="{{ url_for('pages', page='results') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "results" %} aria-current="page"{% endif %}>Results</a>
                    <a href="{{ url_for('pages', page='proof-of-concept') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "proof-of-concept" %} aria-current="page"{% endif %}>Proof of<br>Concept</a>
                    <a href="{{ url_for('pages', page='proposed-implementation') }}" class="dropdown-item"{% if request.endpoint == "pages" and request.view_args.get("page") == "proposed-implementation" %} aria-current="page"{% endif %}>Proposed<br>Implementation</a>
                </div>
            </div>

            <!-- 4. DRYLAB -->
            <div class="nav-item">
                <a href="#" class="nav-link">DRYLAB</a>
                <div class="dropdown-menu">

            <!-- 5. PARTS -->

                <a href="#" class="nav-link">PARTS</a>

            <!-- 6. HP -->

                </div>
            </div>

        </nav>
    </header>

    <script>
    /* 移动端竖向菜单交互：点击大标题在面板内展开二级菜单
       （桌面端不生效，仍使用原有的悬停展开） */
    (function () {
        var toggle  = document.getElementById('nav-toggle');
        var nav     = document.getElementById('site-nav');
        if (!toggle || !nav) return;

        var mobileQuery = window.matchMedia('(max-width: 1024px)');
        var navItems    = nav.querySelectorAll('.nav-item');

        function isMobile() { return mobileQuery.matches; }

        function collapseAll() {
            navItems.forEach(function (item) { item.classList.remove('is-expanded'); });
        }

        function syncScrollLock() {
            document.body.classList.toggle('menu-open', toggle.checked);
        }

        /* 点击大标题：含二级菜单的展开，不含二级菜单的（如 HOME）直接跳转 */
        navItems.forEach(function (item) {
            var link = item.querySelector(':scope > a.nav-link');
            var menu = item.querySelector(':scope > .dropdown-menu');
            if (!link || !menu) return;

            /* 二级菜单顶部插入“返回”按钮 */
            var back = document.createElement('button');
            back.type = 'button';
            back.className = 'submenu-back';
            back.innerHTML = '<i></i>Back';
            back.addEventListener('click', function (event) {
                event.preventDefault();
                item.classList.remove('is-expanded');
            });
            menu.insertBefore(back, menu.firstChild);

            link.addEventListener('click', function (event) {
                if (!isMobile()) return;          /* 桌面端保持原链接行为 */
                event.preventDefault();
                var willOpen = !item.classList.contains('is-expanded');
                collapseAll();
                if (willOpen) item.classList.add('is-expanded');
            });
        });

        /* 菜单开关状态变化 */
        toggle.addEventListener('change', function () {
            if (!toggle.checked) collapseAll();
            syncScrollLock();
        });

        /* 移动端菜单展开时锁定页面滚动 */
        var backdrop = document.createElement('div');
        backdrop.className = 'nav-backdrop';
        backdrop.addEventListener('click', function () {
            toggle.checked = false;
            collapseAll();
            syncScrollLock();
        });
        document.body.appendChild(backdrop);

        /* 视口回到桌面尺寸时复位 */
        function reset() {
            if (!isMobile()) {
                toggle.checked = false;
                collapseAll();
                syncScrollLock();
            }
        }
        if (mobileQuery.addEventListener) mobileQuery.addEventListener('change', reset);
        else if (mobileQuery.addListener) mobileQuery.addListener(reset);
        window.addEventListener('resize', reset);
        window.addEventListener('orientationchange', reset);
    })();
    </script>
