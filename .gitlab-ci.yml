image: python:3.12

pages:
  stage: build
  script:
    - pip install --no-cache-dir -r dependencies.txt
    - FLASK_APP=app.py flask freeze
    - mkdir -p public/assets
    - cp -R static/home/assets/. public/assets/
    - cp static/home/*.webm public/
    - cp static/home/*.mp4 public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # No runners will run on branches other than main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
